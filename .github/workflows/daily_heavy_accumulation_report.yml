name: 每日台股主力重押日報 (川湖+凱基三多模型 Email 派發)

env:
  TZ: "Asia/Taipei"
  PYTHONIOENCODING: "utf-8"

on:
  schedule:
    # 每日 20:07 (台灣時間，即 UTC 12:07) 避開整點高峰，自動執行全市場分點分析與郵件發送
    - cron: "7 12 * * 1-5"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "回溯分析最大交易天數 (預設: 60，自動切分 5日/20日/60日 三週期)"
        required: false
        default: "60"

jobs:
  run-daily-report:
    name: 執行川湖模型分析並派送 Email 報告
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安裝專案依賴
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas numpy openpyxl requests beautifulsoup4 google-api-python-client google-auth

      - name: 執行雲端分析與派發 Email / Telegram
        env:
          GDRIVE_UPLOAD_URL: ${{ secrets.GDRIVE_UPLOAD_URL }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_LOG_FOLDER_ID: ${{ secrets.GDRIVE_LOG_FOLDER_ID }}
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '5' }}
          INPUT_MIN_AMT: ${{ github.event.inputs.min_amt || '0.3' }}
          INPUT_MIN_RATIO: ${{ github.event.inputs.min_ratio || '70' }}
        run: |
          python main_cloud_runner.py \
            --lookback-days $INPUT_LOOKBACK_DAYS \
            --output-dir ./daily_reports

      - name: 保存產出報表 (僅 HTML 與 Excel)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-heavy-accumulation-reports
          path: |
            ./daily_reports/*.xlsx
            ./daily_reports/*.html
          retention-days: 14
