name: 每日台股主力重押日報 (川湖+凱基三多模型 Email 派發)

env:
  TZ: "Asia/Taipei"
  PYTHONIOENCODING: "utf-8"

on:
  # =========================================================================
  # 支援定時排程 / 外部 Webhook (cron-job.org) 觸發
  # =========================================================================
  # schedule:
  #   - cron: "7 12 * * 1-5"

  # =========================================================================
  # =========================================================================
  # 支援手動點擊「Run workflow」或 Cron-job.org 呼叫 API 觸發 (預設發送 Email)
  # =========================================================================
  workflow_dispatch:
    inputs:
      target_date:
        description: "指定重跑交易日 (YYYY-MM-DD，留空則自動處理最新當天)"
        required: false
        default: ""
      send_email:
        description: "是否發送 Email 與 Telegram 報告 (預設為開啟)"
        type: boolean
        required: false
        default: true

  repository_dispatch:
    types: [trigger-daily-report, run-daily-report]

jobs:
  run-daily-report:
    name: 執行主力籌碼分析並同步戰情室
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安裝專案依賴
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas numpy openpyxl requests beautifulsoup4 google-api-python-client google-auth

      - name: 判斷執行模式 (排程與 Cron-job 預設發信)
        id: config-mode
        run: |
          # 預設發送 Email 與 Telegram 報告 (適用於 schedule, repository_dispatch, Cron-job.org)
          SEND_EMAIL="true"
          TARGET_DATE=""
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_DATE="${{ github.event.inputs.target_date }}"
            # 只有當使用者在手動介面明確取消勾選 (傳入 false) 時，才關閉發信
            if [ "${{ github.event.inputs.send_email }}" = "false" ]; then
              SEND_EMAIL="false"
            fi
          fi

          echo "send_email=$SEND_EMAIL" >> $GITHUB_OUTPUT
          echo "target_date=$TARGET_DATE" >> $GITHUB_OUTPUT
          echo "=================================================="
          echo "[*] 模式設定完成:"
          echo "    - 觸發事件: ${{ github.event_name }}"
          echo "    - 指定交易日: '${TARGET_DATE:-最新當天}'"
          echo "    - 是否發送 Email / Telegram: '${SEND_EMAIL}'"
          echo "=================================================="

      - name: 執行雲端分析與無條件刪除舊資料並同步 Supabase
        env:
          GDRIVE_UPLOAD_URL: ${{ secrets.GDRIVE_UPLOAD_URL }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_LOG_FOLDER_ID: ${{ secrets.GDRIVE_LOG_FOLDER_ID }}
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          CMD="python main_cloud_runner.py --output-dir ./daily_reports"
          
          # 若有指定日期，加上 --date
          if [ -n "${{ steps.config-mode.outputs.target_date }}" ]; then
            CMD="$CMD --date ${{ steps.config-mode.outputs.target_date }}"
          fi

          # 若不發送 Email，加上 --no-email
          if [ "${{ steps.config-mode.outputs.send_email }}" = "false" ]; then
            CMD="$CMD --no-email"
          fi

          echo "執行命令: $CMD"
          eval $CMD

      - name: 執行主力出貨/逃離雷達 (反向重押偵測)
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          CMD="python find_exit_cases.py --data-dir ./temp_cache_parquet --output ./daily_reports/exit_distribution_cases.xlsx"

          # 若有指定日期，加上 --date
          if [ -n "${{ steps.config-mode.outputs.target_date }}" ]; then
            CMD="$CMD --date ${{ steps.config-mode.outputs.target_date }}"
          fi

          # 僅在允許發信時帶入 --email
          if [ "${{ steps.config-mode.outputs.send_email }}" = "true" ]; then
            CMD="$CMD --email"
          fi

          echo "執行出貨雷達命令: $CMD"
          eval $CMD

      - name: 保存產出報表 (僅 HTML 與 Excel)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-heavy-accumulation-reports
          path: |
            ./daily_reports/*.xlsx
            ./daily_reports/*.html
          retention-days: 14
